<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>星途人生</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: one narrow column like a setlist; sticky HUD on top, a feed of ticket-stub cards below. */
:root{
  --bg:#E8E7EE; --paper:#F8F7FB; --ink:#1A1830; --muted:#5D5977; --line:#CFCCDC;
  --accent:#C8195A; --accent-soft:#F6DCE7; --gold:#B88400; --gold-soft:#FBEFC8;
  --good:#1D7F53; --bad:#B8322A; --warn:#D9690B; --crisis:#1F1B33; --crisis-ink:#F1EEFA;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --num:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100F1B; --paper:#1A1929; --ink:#ECEAF6; --muted:#A39FC0; --line:#33304A;
  --accent:#FF4F8E; --accent-soft:#3A1A2B; --gold:#FFC53D; --gold-soft:#3A3014;
  --good:#4CC48A; --bad:#FF6B5E; --warn:#FF9F43; --crisis:#2B1730; --crisis-ink:#F6EAF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100F1B; --paper:#1A1929; --ink:#ECEAF6; --muted:#A39FC0; --line:#33304A;
  --accent:#FF4F8E; --accent-soft:#3A1A2B; --gold:#FFC53D; --gold-soft:#3A3014;
  --good:#4CC48A; --bad:#FF6B5E; --warn:#FF9F43; --crisis:#2B1730; --crisis-ink:#F6EAF2; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 80px}

/* title */
.hero{padding-block:48px 24px;display:grid;gap:18px}
.hero .eyebrow{font-family:var(--num);font-weight:700;letter-spacing:.18em;font-size:15px;color:var(--accent)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(64px,19vw,128px);line-height:.95;margin:0;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;max-width:34em;color:var(--muted)}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ladder span{font-size:12px;border:1px solid var(--line);padding:2px 9px;border-radius:99px;color:var(--muted)}
.ladder span:last-child{border-color:var(--gold);color:var(--gold);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:14px 26px;font-weight:700;font-size:17px;cursor:pointer;letter-spacing:.04em}
.btn:hover{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.note{font-size:13px;color:var(--muted)}

/* setup */
.setup{display:grid;gap:28px;padding-top:12px}
.setup h2{font-family:var(--display);font-size:30px;margin:0;font-weight:900}
.field{display:grid;gap:10px}
.field>label,.field>.lbl{font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--muted)}
.field input{font:inherit;font-size:20px;padding:10px 14px;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:4px;min-width:0}
.opt b{font-size:17px}
.opt small{font-size:12.5px;line-height:1.5;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt:hover{border-color:var(--accent)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hud-top{display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.who{min-width:0}
.who .nm{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agebox{text-align:right;flex:none}
.agebox .age{font-family:var(--num);font-weight:900;font-size:44px;line-height:.85}
.agebox .age small{font-family:var(--body);font-size:13px;font-weight:500;margin-left:2px}
.tier{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--ink);color:var(--paper);margin-top:4px}
.nums{display:flex;gap:16px;margin-top:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.nums div{font-size:12px;color:var(--muted)}
.nums b{font-family:var(--num);font-size:22px;color:var(--ink);font-weight:700;margin-left:4px;letter-spacing:.02em}
.meters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 12px;margin-top:8px}
.nums small{font-size:11px;color:var(--muted);margin-left:1px}
.confirm[hidden],[hidden]{display:none!important}
.nums .attlow b{color:var(--warn)}
.rv{display:grid;gap:3px;margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--bg);font-size:14px}
.rv b{display:inline-block;min-width:4.5em;margin-right:6px;color:var(--muted);font-weight:700}
.card.crisis .rv{background:rgba(255,255,255,.06)}
.hint{display:block;margin-top:8px;font-size:14px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.m{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 6px;font-size:11.5px}
.m .ml{color:var(--muted)}
.m .mv{font-family:var(--mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.m .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.m .bar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.m.low .bar i{background:var(--warn)}
.m.low .mv,.m.low .ml{color:var(--warn);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.sex{font-family:var(--body);font-size:12px;font-weight:700;color:var(--accent);vertical-align:middle;margin-left:4px}
.restart{margin-top:4px;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11.5px;border-radius:4px;padding:1px 8px;cursor:pointer}
.restart:hover{border-color:var(--accent);color:var(--accent)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);font-size:13.5px}
.cbtn{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:3px 12px;font-size:13px;cursor:pointer}
.cbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
b.ok{color:var(--good)} b.ng{color:var(--bad)}
.card.crisis b.ok{color:#6FE0A6} .card.crisis b.ng{color:#FF8A80}

/* feed */
.feed{display:grid;gap:14px;margin-top:16px}
.year{display:grid;gap:12px}
.yearmark{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.yearmark .n{font-family:var(--num);font-weight:900;font-size:34px;line-height:1;color:var(--accent)}
.yearmark .t{font-size:13px;color:var(--muted)}
.yearmark::after{content:"";flex:1;border-top:1px dashed var(--line);transform:translateY(-6px)}
.year.past .body{display:none}
.year.past .card{padding-block:10px}
.year.past .result p{display:none}
.year.past .yearmark .n{color:var(--muted)}
.card{background:var(--paper);border-radius:10px;padding:16px 18px 16px 22px;position:relative;border:1px solid var(--line);animation:in .35s ease-out}
.card::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;border-left:2px dotted var(--line)}
@keyframes in{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.body{margin:4px 0 0;font-size:16.5px}
.choices{display:grid;gap:8px;margin-top:12px}
.choices.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{display:grid;gap:2px;text-align:left;background:transparent;border:1.5px solid var(--ink);border-radius:7px;padding:9px 12px;cursor:pointer;min-width:0}
.choice .ct{font-weight:700;font-size:15.5px;line-height:1.35}
.choice .cs{font-size:12px;color:var(--muted);line-height:1.4}
.choice:hover{background:var(--ink);color:var(--paper)}
.choice:hover .cs{color:var(--paper);opacity:.75}
.choice.hidden{border-color:var(--gold);border-style:dashed}
.choice.hidden .ct{color:var(--gold)}
.choice.hidden:hover{background:var(--gold);color:var(--paper)}
.choice.hidden:hover .ct{color:var(--paper)}
.result{margin-top:10px;display:grid;gap:6px}
.picked{font-weight:700;font-size:14px;color:var(--muted)}
.result p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--bg);font-variant-numeric:tabular-nums}
.chip.up{color:var(--good)}
.chip.dn{color:var(--bad)}
.ms{background:var(--gold-soft);color:var(--ink);border-left:3px solid var(--gold);padding:5px 10px;font-size:14px;font-weight:500;border-radius:0 6px 6px 0}
.ms::before{content:"★ ";color:var(--gold)}
.card.crisis{background:var(--crisis);color:var(--crisis-ink);border-color:var(--crisis)}
.card.crisis .kicker{color:#FF7FAA}
.card.crisis .choice{border-color:var(--crisis-ink)}
.card.crisis .choice .cs,.card.crisis .picked{color:var(--crisis-ink);opacity:.75}
.card.crisis .choice:hover{background:var(--crisis-ink);color:var(--crisis)}
.card.crisis .choice:hover .cs{color:var(--crisis)}
.card.crisis .chip{background:rgba(255,255,255,.08)}
.card.crisis .chip.up{color:#6FE0A6}
.card.crisis .chip.dn{color:#FF8A80}
.card.dark-temptation .kicker{color:var(--bad)}
.quiet,.yearend{font-size:13.5px;color:var(--muted);margin:0;padding-left:22px}
.yearend .ms{margin-top:6px;color:var(--ink)}

/* end */
.endcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:16px}
.endhead{background:var(--ink);color:var(--paper);padding:22px 22px 18px;display:grid;gap:6px}
.endhead .eyebrow{font-family:var(--num);letter-spacing:.2em;font-size:14px;color:var(--gold)}
.endhead h2{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,60px);margin:0;line-height:1.05}
.endhead .sub{opacity:.85;font-size:15px}
.endbody{padding:18px 22px 22px;display:grid;gap:18px}
.epi{font-family:var(--display);font-size:20px;font-weight:700;border-left:3px solid var(--accent);padding-left:12px;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.stats div{min-width:0}
.stats dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stats dd{margin:0;font-family:var(--num);font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stats dd.txt{font-family:var(--body);font-size:15px;font-weight:700;line-height:1.4}
.sect h3{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
.achs{display:flex;flex-wrap:wrap;gap:6px}
.ach{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.tl li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.tl li span{font-family:var(--num);font-weight:700;color:var(--accent);font-size:16px}
.help{font-size:13.5px;background:var(--bg);padding:10px 12px;border-radius:6px}
.endbtns{display:flex;flex-wrap:wrap;gap:10px}
.choice{min-height:44px}
@media (max-width:560px){
  body{font-size:15px;line-height:1.65}
  .wrap{padding-block:6px 56px}
  .hero{padding-block:28px 16px}
  .hud{padding-block:8px 8px}
  .who .nm{font-size:19px}
  .who .meta{font-size:11.5px}
  .agebox .age{font-size:34px}
  .restart{font-size:11px;padding:0 6px}
  .nums{gap:4px 14px;margin-top:6px}
  .nums b{font-size:19px}
  .meters{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 7px;margin-top:6px}
  .m{font-size:10.5px;gap:0 2px}
  .m .mv{font-size:10px}
  .tags{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:6px}
  .tags::-webkit-scrollbar{display:none}
  .tag{flex:none;font-size:11px}
  .feed{gap:10px;margin-top:10px}
  .year{gap:10px}
  .yearmark .n{font-size:28px}
  .card{padding:12px 13px 13px 18px;border-radius:9px}
  .card::before{left:7px;top:12px;bottom:12px}
  .body{font-size:15.5px}
  .choices{gap:6px;margin-top:10px}
  .choices.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choices.grid .choice{padding:8px 9px}
  .choices.grid .ct{font-size:14.5px}
  .choices.grid .cs{font-size:11px}
  .opts,.opts.three{grid-template-columns:minmax(0,1fr)}
  .rv{font-size:13.5px;padding:7px 9px}
  .rv b{min-width:3.6em}
  .hint{font-size:13.5px}
  .quiet,.yearend{padding-left:4px;font-size:13px}
  .endhead{padding:18px 16px 14px}
  .endbody{padding:14px 16px 18px}
  .stats dd{font-size:22px}
}
@media (max-width:360px){
  .choices.grid{grid-template-columns:minmax(0,1fr)}
  .meters{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.card{animation:none}.m .bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ============ utilities ============ */
const rnd=Math.random, R=(a,b)=>a+rnd()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(rnd()*a.length)], chance=p=>rnd()<p, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmt(n){n=Math.round(n);const sg=n<0?'-':'';n=Math.abs(n);
  if(n>=1e8)return sg+(n/1e8).toFixed(2).replace(/\.?0+$/,'')+'億';
  if(n>=1e4)return sg+(n/1e4).toFixed(n>=1e6?0:1).replace(/\.0$/,'')+'萬';
  return sg+n.toLocaleString('en');}
const cash=n=>(n<0?'-':'')+'US$'+fmt(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OK=t=>`<b class="ok">${t}</b> `, NG=t=>`<b class="ng">${t}</b> `;

/* ============ world data ============ */
const REGIONS={
  gc:{name:'大中華地區',main:['pop'],cap:[5e6,6e7,2.5e8],scopes:['港台','華語市場','歐美市場'],chart:'華語專輯榜',award:'年度樂壇頒獎典禮',fests:['大型戶外音樂節'],casino:'澳門',
      desc:'隨機出生於香港或台灣。粵語流行曲與台灣華語樂壇，頒獎禮、商演、狗仔隊，還有一個不能說出名字的龐大市場。'},
  jk:{name:'日韓地區',main:['pop','rap'],cap:[8e6,6e7,2.5e8],scopes:['日韓','亞洲','歐美市場'],chart:'日韓綜合專輯榜',award:'年末歌謠大賞',fests:['仁川搖滾音樂節','富士山麓音樂節'],casino:'濟州島',
      desc:'隨機出生於日本或韓國。練習生制度、偶像組合與年末歌合戰。韓國男生還要面對兵役。'},
  west:{name:'歐美地區',main:['pop','rap','rock','country'],cap:[1.5e7,8e7,3e8],scopes:['本國','歐美市場','全球'],chart:'百大專輯榜',award:'金唱盤大獎',fests:['石楠山音樂節','沙漠谷音樂節'],casino:'拉斯維加斯',
      desc:'隨機出生於歐洲或美國。全球最大的音樂市場，說唱、搖滾與鄉村音樂各有天下，小報、官司和頒獎禮都在等你。'}
};
const GENRES={
  pop:{name:'流行曲',desc:'形象、舞台與旋律。最容易紅，也最容易被取代。'},
  rap:{name:'說唱',desc:'街頭出身、歌詞為王。兄弟可以撐你，也可以毀掉你。'},
  rock:{name:'搖滾樂隊',desc:'四個人的夢想。派對與誘惑特別多，還要平衡隊友之間的感情。'},
  indie:{name:'獨立音樂',desc:'自己寫、自己唱、自己發行。賺錢最難，作品最有深度。'},
  country:{name:'鄉村音樂',desc:'結他、公路與故鄉。在歐美是主流，在亞洲是異類。'}
};
const FAMILIES={
  middle:{name:'小康之家',desc:'父母都是上班族，家裡不算富有，但供得起你學琴。他們最大的願望，是你考上大學、找份穩定工作。',
    init(){S.money=3000;S.s.rel=70;}},
  poor:{name:'基層家庭',desc:'一家五口擠在一個狹小的單位裡。你的第一支結他，是從垃圾站撿回來的。',
    init(){S.money=200;S.s.rel=60;S.s.happy-=5;}},
  stardad:{name:'星二代',desc:'你的父親是紅極一時的樂壇巨星。你一出生就被鏡頭包圍，但所有人都會拿你和他比較。',
    init(){S.money=30000;S.fans=20000;S.s.happy-=5;S.s.rel=72;S.att=20;}},
  rich:{name:'富二代',desc:'家族經營地產生意。錢從來不是問題，問題是家人覺得音樂只是玩意。',
    init(){S.money=300000;S.s.rel=55;}},
  vampire:{name:'吸血鬼父母',desc:'父母對你很好，至少在你還沒有開始賺錢之前。',
    init(){S.money=500;S.s.rel=35;S.s.happy-=5;}},
  control:{name:'控制型父母',desc:'父親年輕時想當歌手但失敗了。他把所有未完成的夢想壓在你身上，從你懂事開始就逼你每天練習。',

function get(k){return STATK.includes(k)?S.s[k]:S[k];}

function d(k,v){if(v>0&&(k==='talent'||k==='crea')&&S.age>=50)v=v*.5;const b=get(k);setv(k,b+v);const a=get(k);if(DIFF&&a!==b)DIFF[k]=(DIFF[k]||0)+(a-b);}
function mul(k,f){d(k,get(k)*(f-1));}

    ['大膽實驗',()=>doRelease(title,'exp',indie),'可能是神作，也可能是災難']
  ]};

function doRelease(title,style,indie){
  const s=S.s,crea0=s.crea,first=S.releases.length===0;
  let q=s.crea*.55+s.talent*.35+S.sediment*.13+8+R(-8,8);
  if(style==='market')q-=2;if(style==='self')q+=5;if(style==='exp')q+=R(-22,22);
  if(first)q+=R(-20,4);
  if(s.happy<=20)q-=6;
  const usedDrug=S.inspired>0,usedReb=S.rebirth>0;
  q+=S.inspired+S.rebirth;if(S.flags.filmBonus){q+=8;S.flags.filmBonus=0;}
  q=clamp(Math.round(q),5,100);S.inspired=0;S.rebirth=0;
  const qg=q<35?-.12:q<50?.08:q<62?.25:q<72?.5:q<80?.85:q<88?1.4:2.2;
  const mm=style==='market'?1.35:style==='self'?.85:1;
  const fit=rf().main.includes(S.genre)?1.2:.85, mg=mgrMult();
  const child=(S.oldImage>40&&S.age>=18)?.8:1;
  let viral=false,gain;
  if(qg<0)gain=S.fans*qg;
  else{const am=.4+S.att/100;gain=(S.fans*qg*mm*fit*mg*child+(5000+s.talent*120)*(q/50)*mg)*am;if(q>=84&&chance(.3)){gain*=2.2;viral=true;}}
  addFans(gain);
  let sales=Math.round(S.fans*(.07+q/650)*(style==='market'?1.15:1)*R(.6,1.2));
  let clash='';

function reviews(q,sales){

    :q>=78?['成熟而自信，主打歌的編曲尤其出色。','水準之作，證明了歌手的實力。']
    :q>=62?['有亮點，但整體略欠驚喜。','中規中矩，有幾首歌值得一聽。']
    :q>=45?['概念模糊，歌與歌之間缺乏連貫。','聽得出努力，但作品仍然稚嫩。']
    :['令人失望，看不出這張專輯存在的意義。','編曲粗糙，歌詞空洞。'];
  const fan=S.fans<5000?['我是你的第一個粉絲！一定要繼續唱下去！','雖然沒甚麼人聽，但我覺得很好聽。']
    :q>=62?['每一首都是神曲！循環了一整晚。','等了這麼久，終於等到了，哭了。']
    :['這次風格不同，但我們永遠支持你！','慢慢聽會喜歡的，不准黑我偶像。'];
  const net=q>=88?['好吧，這次真的無話可說。','我不想承認，但確實好聽。']
    :q>=75?['還可以，但吹得太誇張了。','主打歌好聽，其他都是填充物。']

    :['這也能出專輯？','錄音室的電費都比這張專輯有價值。','建議退圈。'];
  return `<span class="rv"><span><b>樂評 ${ms}/10</b>「${pick(media)}」</span><span><b>粉絲</b>「${pick(fan)}」</span><span><b>網民</b>「${pick(net)}」</span></span>`;
}
function mgrHint(q,crea0){
  const who=(!S.manager||S.manager==='self'||S.manager==='label')?'你在筆記簿寫下：':'經理人：';
  let h;
  if(q>=85)h='「保持這個狀態，不要改變任何東西。」';
  else if(crea0<45)h='「靈感好像不夠用了。下次出碟之前，先閉關或者休息一下吧。」';
  else if(S.s.talent<45)h='「旋律不錯，但唱功拖了後腿。多練練吧。」';
  else if(S.sediment<30)h='「歌是好歌，但聽起來太浮了，欠一點沉澱。閉關一段時間，或者堅持做自己的聲音，作品會更有深度。」';
  else if(S.sediment>=60)h='「作品越來越有深度了。就算現在未必大賣，總有一天會有人發現。」';
  else h='「作品開始有自己的味道了。再沉澱一下，會更好。」';
  return `<span class="hint">${who}${h}</span>`;
}
function retroCard(){
  const top=[...S.releases].sort((a,b)=>b.q-a.q).slice(0,3);

  return {k:'經典回顧專輯',text:`你的靈感已經大不如前。唱片公司建議推出經典回顧專輯，收錄${tt}等代表作。`,choices:[
    ['推出精選輯',()=>retro(false),'穩陣，賣的是回憶'],

function retro(re){
  const top=[...S.releases].sort((a,b)=>b.q-a.q);const base=top.length?top[0].q:50;
  const q=clamp(Math.round(re?base*.5+S.s.talent*.5+R(-10,10):base-10+R(-5,5)),5,100);
  const sales=Math.round(S.fans*R(.01,.04)*(re?1.2:1));
  d('money',sales*1.2*share());d('att',re&&S.s.talent>=60?8:4);boost(1.03);S.lastRel=S.age;S.totalSales+=sales;
  const title=S.name+(re?' 經典重塑':' 經典精選');S.releases.push({title,age:S.age,q,sales,style:'retro'});
  if(re&&S.s.talent<50){d('happy',-6);return NG('今非昔比')+`《${title}》賣出 ${fmt(sales)} 張。樂迷說新版本「聽得出歲月的痕跡」，不是讚美。`+reviews(q,sales);}
  return OK('情懷大賣')+`《${title}》賣出 ${fmt(sales)} 張。一整代人跟著你的歌重溫自己的青春。`+reviews(q,sales);

function pickMgr(m){

/* ============ year flow ============ */
function startYear(){
  S.age++;yearSnap={fans:S.fans,money:S.money};
  if(yearEl)yearEl.classList.add('past');
  yearEl=document.createElement('section');yearEl.className='year';
  yearEl.innerHTML=`<div class="yearmark"><span class="n">${S.age}</span><span class="t">歲 · ${esc(tierName(tierIdx()))}</span></div>`;
  $('#feed').appendChild(yearEl);
  S.phase='focus';
  if(S.jail>0){
    const n=S.flags.jailYear=(S.flags.jailYear||0)+1;
    S.q.push({k:'獄中',cls:'crisis',text:`獄中第 ${n} 年。鐵窗外的世界照常運轉，樂壇早已有新的名字。`,choices:[
      ['在獄中寫歌',()=>{d('crea',12);d('sediment',12);d('happy',-4);return jailTick('你在一本練習簿上寫滿了歌詞。');}],
      ['在獄中反省',()=>{d('happy',10);return jailTick('你讀完了圖書館裡所有的書。');}]]});
  } else if(S.trainee>0){
    S.coDebt+=30000;
    S.q.push({k:'練習生',text:`練習生生涯第 ${S.age-S.ageSigned+1} 年。每月評核，每個星期都有人被淘汰。公司把訓練費、宿舍和伙食全部記在你的賬上，你已欠公司 ${cash(S.coDebt)}。`,choices:[
      ['加練到凌晨',()=>{d('talent',9);d('health',-5);d('happy',-8);return traineeTick('你的舞步終於跟上了隊形。');}],
      ['節食減重',()=>{d('talent',4);d('health',-8);d('happy',-8);S.flags.traineeLook=(S.flags.traineeLook||0)+10;return traineeTick('體重計上的數字成了你最在意的東西。');}],
      ['保持狀態',()=>{d('talent',5);d('happy',3);return traineeTick('你在宿舍的天台上看了很多次日落。');}]]});
  } else {
    S.q.push({k:'年度重點',grid:1,text:yearPrompt(),choices:focusOptions()});
  }
  next();
}
function yearPrompt(){
  if(!S.debuted)return S.age<=15?'新的一年。你打算把時間花在哪裡？':'你還未出道。今年要怎樣接近夢想？';
  if(S.s.health<30)return '你的身體在發出警號。今年的重點是？';
  if(S.s.happy<=30)return '你已經很久沒有真正快樂過了。今年的重點是？';
  if(S.s.crea<20)return '你已經很久寫不出好歌了。今年的重點是？';
  return '今年的工作重點是？';
}
function jailTick(t){S.jail--;if(S.jail<=0){S.flags.jailYear=0;queueCrisis('身陷囹圄');return t+' 你刑滿出獄，門外只有寥寥幾個記者。';}return t;}
function traineeTick(t){S.trainee--;if(S.trainee<=0){S.flags.traineeDone=1;
  const sc=S.s.talent+(S.flags.traineeLook||0)+R(15,55);
  if(sc>=100){const g=pick(GROUPS);const r=debut();d('fans',60000+S.s.talent*1000);
    return t+' '+OK('成功出道')+`公司宣布出道名單，你的名字在上面！${S.genre==='pop'||S.genre==='rap'?`你以組合 ${g} ${S.genre==='rap'?'的 rapper':'成員'}身份出道。`:r}`;}
  S.manager=null;S.signed=false;d('happy',-15);queueCrisis('練習生淘汰');logk('練習生淘汰');
  const owe=Math.round(S.coDebt*.5);S.coDebt=0;d('money',-owe);
  return t+' '+NG('落選')+`出道名單上沒有你的名字。你收拾行李，離開了住了幾年的宿舍。公司寄來一封律師信，要求你償還一半訓練費 ${cash(owe)}。`;}
  return t;}

function buildEvents(){
  const ok=e=>{if(e.once&&S.seen[e.id]!=null)return false;if(e.cd&&S.seen[e.id]!=null&&S.age-S.seen[e.id]<e.cd)return false;try{return !!e.if();}catch(err){return false;}};
  const forced=EV.filter(e=>e.force&&ok(e)&&(typeof e.force!=='function'||e.force())).slice(0,2);
  forced.forEach(e=>{S.seen[e.id]=S.age;S.q.push(evCard(e));});
  if(S.over)return;
  const r=rnd();let n;
  if(!S.debuted&&S.age<15)n=r<.4?0:r<.9?1:2;else n=r<.25?0:r<.7?1:r<.95?2:3;
  if(S.jail>0)n=0;
  n=Math.max(0,n-forced.length);
  let pool=EV.filter(e=>!e.force&&ok(e));
  for(let i=0;i<n&&pool.length;i++){
    const rm=S.s.rel<35?2:S.s.rel>=70?.6:1;
    const ws=pool.map(e=>Math.max(0,(typeof e.w==='function'?e.w():(e.w||1))*(e.trouble?rm:1)));
    let tot=ws.reduce((a,b)=>a+b,0);if(tot<=0)break;let x=rnd()*tot,j=0;
    for(;j<pool.length;j++){x-=ws[j];if(x<=0)break;}
    j=Math.min(j,pool.length-1);
    const e=pool[j];pool.splice(j,1);S.seen[e.id]=S.age;S.q.push(evCard(e));
  }
}
function evCard(e){const x=e.prep?e.prep():{};return {k:e.k||'事件',cls:e.cls||'',text:e.text(x),choices:e.c(x).filter(Boolean),evId:e.id};}

function endYear(){
  CURMS=[];const s=S.s;
  if(S.debuted){
    S.money+=S.fans*.035*share()*(S.chinaLocked&&S.region==='gc'?.7:1);
    if(S.coDebt>0&&S.money>0){const rp=Math.round(Math.min(S.coDebt,S.money*.35));S.coDebt-=rp;S.money-=rp;}
    const ysr=S.age-(S.lastRel==null?S.age:S.lastRel);
    let dec=ysr>=5?.15:ysr>=3?.06:.01;
    if(S.att<15)dec+=.12;else if(S.att<30)dec+=.06;
    if(S.jail)dec+=.12;
    S.fans=Math.round(S.fans*(1-dec));
    S.sediment=clamp(S.sediment+2,0,100);
  }
  {const over=S.age-ageCap();
   if(over<=0)S.att=clamp(S.att+RI(3,6),0,100);else S.att=clamp(S.att-(3+Math.floor(over/3)),0,100);
   if(S.jail)S.att=clamp(S.att-10,0,100);}
  if(S.age>=18&&!S.jail&&!S.trainee)S.money-=S.debuted?COST[tierIdx()]:(S.age>=22?2000:0);
  if(S.addiction>0){s.health-=Math.ceil(S.addiction/6);s.happy-=3;S.money-=S.addiction*300*(1+tierIdx());}
  if(S.age>=35)s.health--;if(S.age>=45)s.health--;if(S.age>=55)s.health-=2;if(S.age>=62)s.health-=2;if(S.age>=70)s.health-=4;
  if(S.manager==='shark')s.happy-=4;else if(S.manager==='self'&&S.debuted)s.happy-=2;else if(S.manager==='major')s.happy-=1;
  if(tierIdx()>=5)s.happy-=4;else if(tierIdx()>=4)s.happy-=2;
  if(s.rel>=70)s.happy+=2;else if(s.rel<30)s.happy-=2;if(S.married)s.happy+=1;
  if(S.manager==='indie')s.crea+=2;
  if(s.happy<20){s.health-=7;s.talent-=4;s.crea-=6;}else if(s.happy<40){s.health-=3;s.talent-=2;s.crea-=3;}
  if(S.age>=50){s.talent-=S.age>=60?3:2;s.crea-=(S.peakTier>=5?6:S.age>=60?3:2);}
  if(S.flags.smoke){s.health-=2;s.talent-=1;s.happy+=1;}
  if(S.money<0)s.happy-=S.money<-100000?14:10;
  s.rel-=2;
  S.lowH=s.happy<40?S.lowH+1:0;
  S.vlowH=s.happy<5?(S.vlowH||0)+1:0;
  s.crea+=3;if(S.age<35)s.health+=1;
  STATK.forEach(k=>s[k]=clamp(Math.round(s[k]),0,100));
  if(S.band&&S.band.active)S.band.m.forEach((m,i)=>baff(i,RI(-4,1)));
  S.money=Math.round(S.money);
  checkMilestones();
  const df=S.fans-yearSnap.fans,dm=S.money-yearSnap.money;
  const p=document.createElement('p');p.className='yearend';
  p.innerHTML=`年終結算：粉絲 ${fmt(S.fans)}（${df>=0?'+':''}${fmt(df)}）· 金錢 ${cash(S.money)}（${dm>=0?'+':''}${fmt(dm)}）`+CURMS.map(m=>`<div class="ms">${esc(m)}</div>`).join('');
  yearEl.appendChild(p);CURMS=null;
  if((s.health<=0||S.age>=95)&&!S.over)healthDeath();
  if(!S.over&&S.debuted&&S.att<=0&&S.age>=18)finish('fade',S.flags.plasticFail?FADE_PLASTIC:pick(FADE));
  updateHUD();
}

function next(){
  if(S.over)return showEnd();
  if(S.phase==='birth'){S.phase='';return startYear();}
  if(S.q.length){showCard(S.q.shift());return;}
  if(S.phase==='focus'){S.phase='events';buildEvents();if(S.over)return showEnd();
    if(S.q.length)return next();
    const p=document.createElement('p');p.className='quiet';p.textContent=pick(['這一年平靜地過去了。','日子一天天過去，沒有甚麼特別的事。','這一年，你過得很平淡。','一整年都沒有大事發生。']);yearEl.appendChild(p);}
  endYear();
  if(S.over)return showEnd();
  startYear();
}

const $=(q,el=document)=>el.querySelector(q);
const app=$('#app');
function chips(df){
  const ks=Object.keys(df||{}).filter(k=>LABEL[k]);if(!ks.length)return '';
  return '<div class="chips">'+ks.map(k=>{const v=df[k];const bad=k==='addiction'?v>0:v<0;
    const val=k==='money'?(v>0?'+':'-')+cash(Math.abs(v)).replace('US$','$'):k==='fans'?(v>0?'+':'')+fmt(v):(v>0?'+':'')+v;
    return `<span class="chip ${bad?'dn':'up'}">${LABEL[k]} ${val}</span>`;}).join('')+'</div>';
}
function showCard(card){
  const el=document.createElement('article');el.className='card '+(card.cls||'');
  el.innerHTML=`<div class="kicker">${esc(card.k)}</div><p class="body">${card.text}</p><div class="choices${card.grid?' grid':''}"></div>`;
  const box=$('.choices',el);
  card.choices.forEach(([t,fn,sub,hidden])=>{const b=document.createElement('button');b.className='choice'+(hidden?' hidden':'');
    b.innerHTML=`<span class="ct">${esc(t)}</span>${sub?`<span class="cs">${esc(sub)}</span>`:''}`;
    b.onclick=()=>resolve(el,t,fn);box.appendChild(b);});
  yearEl.appendChild(el);
  updateHUD();
  requestAnimationFrame(()=>el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}));
}
function resolve(el,t,fn){
  DIFF={};CURMS=[];
  let res='';try{res=fn()||'';}catch(e){console.error(e);res='';}
  if(S&&!S.over&&S.s.health<=0){healthDeath();res+=' '+NG('倒下')+'你的身體終於撐不住了。';}
  checkMilestones();
  const df=DIFF,m=CURMS;DIFF=null;CURMS=null;
  $('.choices',el).remove();
  el.insertAdjacentHTML('beforeend',`<div class="result"><div class="picked">› ${esc(t)}</div>${res?`<p>${res}</p>`:''}${chips(df)}${m.map(x=>`<div class="ms">${esc(x)}</div>`).join('')}</div>`);
  updateHUD();next();
}
function meter(k,v){const warn=k==='happy'?v<40:k==='att'?v<25:v<25;return `<div class="m${warn?' low':''}"><span class="ml">${LABEL[k]}</span><span class="mv">${v}</span><span class="bar"><i style="width:${v}%"></i></span></div>`;}
function updateHUD(){
  const h=$('#hud');if(!h||!S)return;const s=S.s;
  const tags=[];
  tags.push(S.manager?MGR[S.manager].name:(S.debuted?'自己管理':'未簽約'));
  if(S.trainee>0)tags.push('練習生');
  tags.push('市場：'+S.markets.filter(m=>!(m==='cn'&&S.chinaLocked)).map(m=>MARKETS[m].n).join('、'));
  if(S.love)tags.push('戀人：'+S.love+(S.married?'（已婚）':''));
  if(S.band)tags.push(S.band.active?'樂隊默契 '+Math.round(bandAvg()):'已離開樂隊');
  if(S.bro)tags.push(`兄弟${S.bro.n} ${S.bro.t}`);
  if(S.oldImage>20)tags.push('童星形象 '+S.oldImage);
  const warn=[];if(S.coDebt>0)warn.push('欠公司 '+cash(S.coDebt));if(S.flags.disgraced)warn.push('失德藝人');if(S.chinaLocked)warn.push('遭十二億市場封殺');if(S.addiction>0)warn.push('成癮 '+S.addiction);if(S.jail>0)warn.push('服刑中');if(S.sink>0)warn.push('低潮 ×'+S.sink);
  h.innerHTML=`<div class="hud-top"><div class="who"><div class="nm">${esc(S.name)} <span class="sex">${S.gender==='f'?'♀ 女':'♂ 男'}</span></div>
    <div class="meta">${HOMES[S.home].n} · ${GENRES[S.genre].name} · ${FAMILIES[S.family].name}</div>
    <span class="tier">${tierName(tierIdx())}</span></div>
    <div class="agebox"><div class="age">${Math.max(S.age,12)}<small>歲</small></div><button class="restart" id="rs">重新開局</button></div></div>
    <div class="confirm" id="rsc" hidden><span>放棄這一生，重新開始？</span><button class="cbtn" id="rsy">確定</button><button class="cbtn ghost" id="rsn">取消</button></div>
    <div class="nums"><div>粉絲人數<b>${fmt(S.fans)}</b></div><div class="${S.att<25?'attlow':''}">關注度<b>${S.att}</b><small>/100</small></div><div>金錢<b>${cash(S.money)}</b></div></div>
    <div class="meters">${STATK.map(k=>meter(k,s[k])).join('')}</div>
    <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${warn.map(t=>`<span class="tag warn">${esc(t)}</span>`).join('')}</div>`;
  $('#rs').onclick=()=>{$('#rsc').hidden=!$('#rsc').hidden;};
  $('#rsy').onclick=()=>showSetup();

  '一線實力派':['不是最紅的那一個，卻是最真的那一個。'],
  '地下傳說':['知道你的人不多，但他們永遠不會忘記。'],
  '半紅不黑':['總有人記得你的某一首歌，只是想不起你的名字。','不上不下的一生，也是唱足了一生。'],
  '過氣天王':['站過最高的地方，也看過最長的日落。'],
  '過氣天后':['站過最高的地方，也看過最長的日落。'],
  '被世界遺忘':['曾經，你也是別人的偶像。','掌聲停了，歌還在你心裡。'],
  '默默無聞':['這裡安息著一個唱過歌的人。'],
  '幕後推手':['台前的光，有一半是你點亮的。'],
  '回家繼承家業':['那支結他，一直掛在辦公室的牆上。'],
  '平凡人生':['夢想沒有實現，但你曾經很認真地做過夢。'],
  '未完的夢':['那首歌，始終沒有機會唱給世界聽。'],
  '光榮引退':['在最好的時候離開，也是一種勇氣。']
};
function careerTitle(){
  const pt=S.peakTier,hits=S.releases.filter(r=>r.q>=80).length;
  if(!S.debuted)return '未完的夢';
  if(pt>=6)return '傳奇巨星';
  if(pt>=5&&tierIdx()>=4)return '殿堂級長青';
  if(S.lateBloom&&pt>=4)return '大器晚成';
  if(hits===1&&pt>=3)return '一曲歌手';
  if(pt>=4)return '一線實力派';
  if(S.sediment>=80)return '地下傳說';
  if(pt>=3)return '半紅不黑';
  return '默默無聞';
}
function computeEnding(){
  const o=S.over,pt=S.peakTier;
  if(o.type==='death'){if(S.age===27){ach('27歲俱樂部');return '27歲俱樂部';}if(S.age<45)return '英年早逝';return careerTitle();}
  if(o.type==='heir')return '回家繼承家業';
  if(o.type==='ordinary')return '平凡人生';
  if(o.type==='backstage')return '幕後推手';
  if(o.type==='fade'){if(pt>=6)return '傳奇巨星';if(pt>=5)return S.gender==='f'?'過氣天后':'過氣天王';if(pt<=2&&S.sediment<80)return '被世界遺忘';return careerTitle();}
  if(o.type==='retire'){const t=careerTitle();return tierIdx()>=4?'光榮引退':t;}
  return careerTitle();
}
function showEnd(){
  CURMS=null;
  const title=computeEnding(),pt=S.peakTier;
  if(S.chinaLocked&&pt>=5)ach('十二億之外');
  if(S.bro&&S.bro.t>=70&&pt>=4)ach('兄弟情深');
  if(S.age>=65&&S.debuted&&S.fans>=1e6&&S.over.type!=='fade')ach('不老傳說');
  if(S.flags.soloFans&&S.peakFans>=S.flags.soloFans*2&&pt>=4)ach('單飛成神');
  if(S.family==='child'&&S.oldImage<=20&&pt>=4)ach('擺脫童星');
  if(!S.worst&&pt>=4)ach('完美偶像');
  const best=[...S.releases].sort((a,b)=>b.q-a.q||b.sales-a.sales)[0];
  const o=S.over;
  const sub=o.type==='death'?o.text:o.type==='fade'?o.text+` ${S.age}歲，世界對你的關注降到了零。`:o.type==='retire'?`${S.age}歲，你宣布退出樂壇。`:o.type==='backstage'?`${S.age}歲，你轉到幕後，成為無數新人背後的推手。`:o.type==='heir'?`${S.age}歲，你放下咪高峰，回家繼承家業。`:`${S.age}歲，你放下了音樂。`;
  const epi=pick(EPI[title]||['星途已盡。']);
  const drugRelated=o.cause==='drug'||S.drugUses>0;
  const tl=[...S.log,...S.milestones.map(m=>({age:m.age,t:m.t}))].sort((a,b)=>a.age-b.age);
  const seenT=new Set();const tlu=tl.filter(x=>{const k=x.age+x.t;if(seenT.has(k))return false;seenT.add(k);return true;}).slice(0,26);
  window.scrollTo(0,0);
  app.innerHTML=`<div class="endcard"><div class="endhead"><div class="eyebrow">STARDOM · 12 → ${S.age}</div>
    <h2>${esc(title)}</h2><div class="sub">${esc(S.name)} · ${S.gender==='f'?'女':'男'} · ${HOMES[S.home].n} · ${GENRES[S.genre].name} · ${FAMILIES[S.family].name}出身</div></div>
    <div class="endbody"><p>${esc(sub)}</p><p class="epi">${esc(epi)}</p>
    ${S.flags.disgraced?'<p class="help">你在樂壇的名字旁邊，永遠標註著「失德藝人」。</p>':''}
    <dl class="stats">
      <div><dt>代表作</dt><dd class="txt">${best?`《${esc(best.title)}》<br><span class="note">${best.age}歲 · 評分 ${best.q} · ${fmt(best.sales)} 張</span>`:'沒有發表專輯'}</dd></div>
      <div><dt>最高級別</dt><dd class="txt">${tierName(pt)}</dd></div>
      <div><dt>最高粉絲數</dt><dd>${fmt(S.peakFans)}</dd></div>
      <div><dt>累積銷量</dt><dd>${fmt(S.totalSales)}</dd></div>
      <div><dt>發表專輯</dt><dd>${S.releases.length}</dd></div>
      <div><dt>年度大獎</dt><dd>${S.awards}</dd></div>
      <div><dt>最終財產</dt><dd>${cash(S.money)}</dd></div>
      <div><dt>最大醜聞</dt><dd class="txt">${S.worst?esc(S.worst.t)+`<br><span class="note">${S.worst.age}歲</span>`:'一生清白'}</dd></div>
    </dl>
    ${S.ach.length?`<div class="sect"><h3>成就</h3><div class="achs">${S.ach.map(a=>`<span class="ach">${esc(a)}</span>`).join('')}</div></div>`:''}
    ${tlu.length?`<div class="sect"><h3>一生大事</h3><ul class="tl">${tlu.map(x=>`<li><span>${x.age}</span>${esc(x.t)}</li>`).join('')}</ul></div>`:''}
    ${drugRelated?`<p class="help">現實中，藥物問題是可以求助的。香港禁毒處查詢熱線：186 186；其他地區請聯絡當地的戒毒或醫療服務。</p>`:''}
    <div class="endbtns"><button class="btn" id="again">再活一次</button><button class="btn ghost" id="copy">複製結果</button></div>
    <p class="note" id="copied" hidden>已複製，可以貼到社交媒體了。</p>
    </div></div>`;
  $('#again').onclick=showSetup;
  const shareTxt=`《星途人生》\n${S.name}｜${S.gender==='f'?'女':'男'}｜${HOMES[S.home].n}｜${GENRES[S.genre].name}\n${FAMILIES[S.family].name}出身，星途：12 → ${S.age}歲\n結局：${title}\n${best?`代表作：《${best.title}》（評分 ${best.q}）\n`:''}最高粉絲：${fmt(S.peakFans)}｜累積銷量：${fmt(S.totalSales)}\n${S.ach.length?'成就：'+S.ach.join('、')+'\n':''}「${epi}」`;
  $('#copy').onclick=()=>{const done=()=>{$('#copied').hidden=false;};
    try{navigator.clipboard.writeText(shareTxt).then(done,()=>fallbackCopy(shareTxt,done));}catch(e){fallbackCopy(shareTxt,done);}};
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}

showTitle();
</script>

</body>
</html>
